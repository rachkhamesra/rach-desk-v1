name = "rach-desk-scheduler"
main = "worker.mjs"
compatibility_date = "2026-10-01"

[triggers]
# Only the moments worker.mjs acts on (UTC; IST is UTC+5:30):
#   00:30 to 01:30 UTC  = 06:00 to 07:00 IST every day      (morning refresh and its retries)
#   13:30 to 16:30 UTC  = 19:00 to 22:00 IST                (weekday evenings; weekends only act at 14:30 UTC = 20:00 IST)
crons = ["30 0 * * *", "0,30 1 * * *", "30 13 * * *", "0,30 14-16 * * *"]

[vars]
REPO = "rachkhamesra/rach-desk-v1"
WORKFLOW = "daily.yml"
REF = "main"
# The GITHUB_TOKEN secret is set separately and never stored in this file:  npx wrangler secret put GITHUB_TOKEN
