name: Daily desk

on:
  # The primary clock is the Cloudflare Worker in scheduler/, which starts this workflow through workflow_dispatch.
  # GitHub's own schedule below is best-effort (it has started jobs hours late or not at all), so it only acts as a
  # backstop: every one of these runs is skippable and exits within seconds when a build has already covered it.
  schedule:
    - cron: "30 0 * * *"         # 6:00 AM IST every day: MCX, results calendar, call transcripts
    - cron: "0,30 1 * * *"       # 6:30 and 7:00 AM IST: retries until a build has run today
    - cron: "30 13 * * 1-5"      # weekdays 7:00 PM IST, then every 30 minutes until 10:00 PM IST: new NSE/BSE session
    - cron: "0,30 14-16 * * 1-5"
    - cron: "17 14 * * 6,0"      # weekends about 7:47 PM IST: weekly-moving data
  workflow_dispatch:
    inputs:
      mode:
        description: "always = build now. daily = build only if the newest session or MCX has something new, or nothing was published today. retry = build only if the newest session or MCX has something new."
        type: choice
        options: [always, daily, retry]
        default: always

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      publish: ${{ steps.build.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/parsed.pkl
            data/holidays.txt
            data/results_calendar.csv
            data/results_actual.csv
            data/universes.json
            data/call_intelligence.json
            data/bse_premium_turnover.csv
            data/mcx_turnover.csv
            data/published.json
            data/heat
            data/power
            data/backtest
          key: desk-data-${{ github.run_id }}
          restore-keys: desk-data-
      - name: Build latest published market session
        # Never hold a runner open for an unpublished date. Retry and daily modes exit early when nothing is new.
        id: build
        run: |
          # A manual run builds (mode always) unless another mode is chosen; the Worker passes the mode it wants.
          # GitHub's own scheduled runs are backstops and may always skip when a build already covered them.
          MODE="${MODE_INPUT:-always}"
          case "$SCHEDULE" in
            "30 13 * * 1-5"|"0,30 14-16 * * 1-5") MODE=retry ;;
            "30 0 * * *"|"0,30 1 * * *"|"17 14 * * 6,0") MODE=daily ;;
          esac
          SKIP=""
          case "$MODE" in
            retry) SKIP="--skip-if-unchanged" ;;
            daily) SKIP="--skip-if-unchanged --daily" ;;
          esac
          echo "mode: $MODE"
          python run.py --wait-minutes 0 $SKIP
        env:
          MODE_INPUT: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
          PYTHONUNBUFFERED: "1"          # so the log shows progress while the build runs
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CALLS_MODEL: gpt-6-luna
          CALLS_MAX_NEW: "12"
      - name: Password-lock the page
        # Off unless the repository variable SITE_LOCK is set to "on" (Settings > Secrets and variables > Actions >
        # Variables). When on, it fails the deploy (the previous site stays up) if the SITE_PASSWORD secret is
        # missing or too short, so a locked build is never published unlocked by accident.
        if: steps.build.outputs.publish != 'false' && vars.SITE_LOCK == 'on'
        run: python lock.py site/index.html
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.publish != 'false'
        with:
          path: site
      - name: Save the data cache
        # Only after a real build, so skipped retries do not each store a new ~80 MB cache.
        if: steps.build.outputs.publish != 'false'
        uses: actions/cache/save@v4
        with:
          path: |
            data/parsed.pkl
            data/holidays.txt
            data/results_calendar.csv
            data/results_actual.csv
            data/universes.json
            data/call_intelligence.json
            data/bse_premium_turnover.csv
            data/mcx_turnover.csv
            data/published.json
            data/heat
            data/power
            data/backtest
          key: desk-data-${{ github.run_id }}

  deploy:
    needs: build
    if: needs.build.outputs.publish != 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
