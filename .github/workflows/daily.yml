     name: Daily desk
     on:
       schedule:
         - cron: "30 14 * * 1-5"
       workflow_dispatch: {}
     permissions:
       contents: read
       pages: write
       id-token: write
     concurrency:
       group: pages
       cancel-in-progress: true
     jobs:
       build:
         runs-on: ubuntu-latest
         timeout-minutes: 180
         steps:
           - uses: actions/checkout@v4
           - uses: actions/setup-python@v5
             with:
               python-version: "3.12"
           - run: pip install -r requirements.txt
           - uses: actions/cache@v4
             with:
               path: |
                 data/parsed.pkl
                 data/holidays.txt
               key: desk-data-${{ github.run_id }}
               restore-keys: desk-data-
           - run: python run.py --wait-minutes 120
           - uses: actions/upload-pages-artifact@v3
             with:
               path: site
       deploy:
         needs: build
         runs-on: ubuntu-latest
         environment:
           name: github-pages
           url: ${{ steps.deployment.outputs.page_url }}
         steps:
           - id: deployment
             uses: actions/deploy-pages@v4
