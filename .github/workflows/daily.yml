name: Daily desk

on:
  schedule:
    # 8:00 PM IST, Monday-Friday: Exchange Tracker data should be available by then.
    - cron: "30 14 * * 1-5"
    # 9:00 PM IST, Monday-Friday: automatic second check for late publications.
    - cron: "30 15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            data/parsed.pkl
            data/holidays.txt
            data/results_calendar.csv
            data/results_actual.csv
            data/universes.json
            data/call_intelligence.json
            data/bse_premium_turnover.csv
            data/mcx_turnover.csv
          key: desk-data-${{ github.run_id }}
          restore-keys: desk-data-
      - name: Build latest published market session
        # Never hold a runner open for an unpublished date. A later scheduled run
        # will pick it up while this run still refreshes Exchange Tracker and deploys.
        run: python run.py --wait-minutes 0
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CALLS_MODEL: gpt-6-luna
          CALLS_MAX_NEW: "12"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
