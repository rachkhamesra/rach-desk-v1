name: Daily desk

on:
  schedule:
    # 6:00 AM IST, Monday-Friday: read MCX's official rendered OPTFUT Summary Report and redeploy.
    - cron: "30 0 * * 1-5"
    # 6:30 AM to 9:30 AM IST every 30 minutes: retries for the 6 AM run above, which GitHub has started hours late
    # or not at all. They exit early unless nothing was published yet today or MCX has posted a newer day.
    - cron: "0,30 1-3 * * 1-5"
    # From 7:00 PM IST every 30 minutes until 1:00 AM IST, Monday-Friday. Each run first checks whether the
    # newest session (including BSE delivery, which publishes after NSE) is already live and exits if so,
    # so the retries stop costing anything once the day is complete. GitHub may start these a while late.
    - cron: "30 13 * * 1-5"
    - cron: "0,30 14-19 * * 1-5"
    # Saturday and Sunday at about 7:47 AM and 7:47 PM IST: there is no market session to wait for, so these
    # always rebuild. They refresh the weekly-moving data (city temperatures, results calendar, call
    # transcripts, exchange trackers); the second run is a backup in case GitHub drops or delays the first.
    - cron: "17 2 * * 6,0"
    - cron: "17 14 * * 6,0"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      publish: ${{ steps.build.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/parsed.pkl
            data/holidays.txt
            data/results_calendar.csv
            data/results_actual.csv
            data/universes.json
            data/call_intelligence.json
            data/bse_premium_turnover.csv
            data/mcx_turnover.csv
            data/published.json
            data/heat
            data/power
          key: desk-data-${{ github.run_id }}
          restore-keys: desk-data-
      - name: Build latest published market session
        # Never hold a runner open for an unpublished date. The weekday evening retries (not the 6 AM refresh,
        # the weekend refreshes or a manual run) exit early when the newest session is already live.
        id: build
        run: |
          # Only the weekday retries (morning and evening) may exit early; the 6 AM, weekend and manual runs always build.
          case "${{ github.event.schedule }}" in
            "30 13 * * 1-5"|"0,30 14-19 * * 1-5") SKIP="--skip-if-unchanged" ;;
            "0,30 1-3 * * 1-5") SKIP="--skip-if-unchanged --daily" ;;
          esac
          python run.py --wait-minutes 0 $SKIP
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CALLS_MODEL: gpt-6-luna
          CALLS_MAX_NEW: "12"
      - name: Password-lock the page
        # Off unless the repository variable SITE_LOCK is set to "on" (Settings > Secrets and variables > Actions >
        # Variables). When on, it fails the deploy (the previous site stays up) if the SITE_PASSWORD secret is
        # missing or too short, so a locked build is never published unlocked by accident.
        if: steps.build.outputs.publish != 'false' && vars.SITE_LOCK == 'on'
        run: python lock.py site/index.html
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.publish != 'false'
        with:
          path: site
      - name: Save the data cache
        # Only after a real build, so skipped retries do not each store a new ~80 MB cache.
        if: steps.build.outputs.publish != 'false'
        uses: actions/cache/save@v4
        with:
          path: |
            data/parsed.pkl
            data/holidays.txt
            data/results_calendar.csv
            data/results_actual.csv
            data/universes.json
            data/call_intelligence.json
            data/bse_premium_turnover.csv
            data/mcx_turnover.csv
            data/published.json
            data/heat
            data/power
          key: desk-data-${{ github.run_id }}

  deploy:
    needs: build
    if: needs.build.outputs.publish != 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
