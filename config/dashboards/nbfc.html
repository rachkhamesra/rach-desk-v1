 [{"q": "Q2FY25", "date": "2024-10-25", "react": -10.9, "react_n": -0.2, "react_x": -10.6}, {"q": "Q3FY25", "date": "2025-01-31", "react": 0.0, "react_n": 1.0, "w1": 4.5, "w1_x": 7.3, "react_x": -1.0}, {"q": "Q4FY25", "date": "2025-04-25", "react": -2.7, "react_n": 0.3, "w1": 22.6, "w1_x": 20.3, "w2": 28.1, "w2_x": 28.6, "react_x": -3.0}, {"q": "Q1FY26", "date": "2025-07-25", "react": -2.7, "react_n": -1.5, "w1": 8.6, "w1_x": 5.3, "w2": 33.2, "w2_x": 27.5, "react_x": -1.2}, {"q": "Q2FY26", "date": "2025-10-17", "react": -5.1, "react_n": 1.0, "w1": 27.4, "w1_x": 23.9, "w2": 38.4, "w2_x": 31.4, "react_x": -6.1}, {"q": "Q3FY26", "date": "2026-01-16", "react": 0.4, "react_n": -0.3, "w1": -11.9, "w1_x": -11.8, "w2": 12.3, "w2_x": 8.8, "react_x": 0.7}, {"q": "Q4FY26", "date": "2026-05-05", "react": 3.3, "react_n": 0.9, "w1": -5.4, "w1_x": 1.1, "w2": -16.6, "w2_x": -10.1, "react_x": 2.5}, {"q": "Q1FY27", "date": "2026-07-17", "react": -1.0, "react_n": 0.7, "w1": 8.7, "w1_x": 7.5, "w2": 2.9, "w2_x": 8.2, "react_x": -1.7}, {"q": "Q2FY27", "date": "2026-10-09", "react": 2.6, "react_n": 0.6, "w1": -6.3, "w1_x": 1.2, "w2": 1.9, "w2_x": 8.2, "react_x": 2.0}], "topics": {"Q3FY25": {"Margins / NIM / funding cost": 0.6, "Credit cost / asset quality": 6.2, "Growth / AUM / disbursement": 4.7, "Unsecured / risk appetite": 1.0, "ROA / ROE / returns": 0.4, "Capital / leverage / dilution": 0.6, "Distribution / branches / gold": 2.0, "Regulation / macro": 1.6}, "Q4FY25": {"Margins / NIM / funding cost": 1.6, "Credit cost / asset quality": 4.5, "Growth / AUM / disbursement": 5.6, "Unsecured / risk appetite": 0.8, "ROA / ROE / returns": 1.6, "Capital / leverage / dilution": 0.6, "Distribution / branches / gold": 4.1, "Regulation / macro": 1.4}, "Q1FY26": {"Margins / NIM / funding cost": 2.3, "Credit cost / asset quality": 3.8, "Growth / AUM / disbursement": 3.6, "Unsecured / risk appetite": 2.5, "ROA / ROE / returns": 1.0, "Capital / leverage / dilution": 1.2, "Distribution / branches / gold": 2.4, "Regulation / macro": 1.1}, "Q2FY26": {"Margins / NIM / funding cost": 1.8, "Credit cost / asset quality": 4.5, "Growth / AUM / disbursement": 5.9, "Unsecured / risk appetite": 0.5, "ROA / ROE / returns": 1.0, "Capital / leverage / dilution": 0.6, "Distribution / branches / gold": 5.6, "Regulation / macro": 2.5}, "Q3FY26": {"Margins / NIM / funding cost": 2.4, "Credit cost / asset quality": 7.4, "Growth / AUM / disbursement": 6.6, "Unsecured / risk appetite": 2.1, "ROA / ROE / returns": 2.6, "Capital / leverage / dilution": 1.1, "Distribution / branches / gold": 7.4, "Regulation / macro": 1.7}, "Q4FY26": {"Margins / NIM / funding cost": 3.4, "Credit cost / asset quality": 7.1, "Growth / AUM / disbursement": 7.3, "Unsecured / risk appetite": 1.5, "ROA / ROE / returns": 2.9, "Capital / leverage / dilution": 1.0, "Distribution / branches / gold": 3.8, "Regulation / macro": 1.7}, "Q1FY27": {"Margins / NIM / funding cost": 4.8, "Credit cost / asset quality": 8.8, "Growth / AUM / disbursement": 5.7, "Unsecured / risk appetite": 1.2, "ROA / ROE / returns": 2.2, "Capital / leverage / dilution": 0.8, "Distribution / branches / gold": 3.5, "Regulation / macro": 2.2}, "Q2FY27": {"Margins / NIM / funding cost": 5.4, "Credit cost / asset quality": 10.7, "Growth / AUM / disbursement": 5.3, "Unsecured / risk appetite": 0.6, "ROA / ROE / returns": 3.6, "Capital / leverage / dilution": 0.2, "Distribution / branches / gold": 3.7, "Regulation / macro": 2.1}}, "last": 484.8, "ret_since": 14.9, "splits": []}}, "q8": ["Q3FY25", "Q4FY25", "Q1FY26", "Q2FY26", "Q3FY26", "Q4FY26", "Q1FY27", "Q2FY27"], "views": {"intro": "These are my own inferences, built from the eight quarters of data, the Q2 FY27 calls, the lever analysis and the share-price reactions. \u201cWhat the market wanted\u201d is a prediction, not a quote. Valuation is price to book at the 13 Nov 2026 close against September 2026 net worth (Aditya Birla Capital\u2019s share count is an estimate). This is a view on the stocks, not investment advice.", "themes": ["Rates turned: every call discussed the October repo move. Companies with a large floating book (Aditya Birla Capital ~70%, Poonawalla, L&T Finance) were asked how fast they can pass it on.", "Capital raises are the new ROE question: Bajaj (\u20b911,700 cr QIP plus promoter warrants), Chola (enabling resolution, likely next financial year), Aditya Birla Capital (\u20b94,000 cr) and Poonawalla (\u20b92,500 cr QIP) all have or are adding equity. More equity lowers leverage and dilutes ROE unless growth uses it.", "Gold loans are everywhere and analysts now ask about stress in them (Bajaj and L&T Finance were asked directly)."], "cos": {"ABCAPITAL": {"read": "Positive", "stance": "Constructive (valuation full)", "line": "Best operating momentum, but the credit-cost tailwind is used up.", "expected": "After flat margins for seven quarters and credit cost near 1.0%, I expect the market wanted two things: margins to stop slipping and growth to hold at ~25% on the new \u20b94,000 cr equity. Credit cost was assumed to stay low, not fall further.", "delivered": "ABFL RoA 2.45% (+25 bps YoY), credit cost 0.92% (best in seven years), AUM +26%, opex to AUM 1.84%, Stage 2+3 2.31%. NIM was 6.00%, flat to slightly down. Housing arm RoA 2.12% with AUM +50%. Management lifted its benchmark lending rate 25 bps on the ~70% variable book.", "asked": ["Has retail disbursement slowed, and is underwriting being tightened?", "When does margin expansion start, and will competitors also raise rates?", "Are disbursement yields now above book yield, and what if another hike follows?"], "why": "Delivery beat on returns and asset quality; margin was the only soft spot and it is the question analysts keep asking. Results-window reaction was +3.4 points vs Nifty.", "view": "Returns are rising and asset quality is the best of the group, but ~44 bps of the RoA gain came from lower credit cost that cannot fall much further. The next leg needs NIM or volume, and the equity raise adds capital that must earn. I would lean constructive while margin holds at 6% after the rate move.", "change": "Turns negative if NIM falls below ~5.8% or disbursement growth stalls. Turns more positive if unsecured mix lifts margin as management argues (+25\u201330 bps).", "valuation": "About 3.2x book (share count estimated) on a Q2 ROE of 14.4%. That quarter was unusually strong; the prior quarter was 11.4%, which is about 28x implied earnings against 22x on the high quarter. The price already assumes ROE moves to the mid-teens, so upside needs the mix-led margin lever, not more credit-cost relief."}, "BAJFINANCE": {"read": "Mixed", "stance": "Neutral", "line": "Still the quality benchmark, but the first cracks and a large raise raise the bar.", "expected": "With AUM growth easing from 28% to ~25% and credit cost improving, I expect the market wanted stable ~25% growth, falling credit cost and a clean quarter after the one-time items of the last two quarters.", "delivered": "AUM +26%, ROA 4.6%, ROE 20.6%, cost of funds 7.31% (\u22129 bps QoQ). Credit cost 1.56% (1.32% before a \u20b9337 cr prudent provision). GNPA rose 10 bps to 1.06%, with a \u20b91,047 cr rise in gold-loan Stage 2/3 from short-tenor schemes. New loans +11% (festival timing). \u20b911,700 cr QIP plus promoter warrants announced. Guided 60\u201362 MM new loans for FY27.", "asked": ["Where else could stress build beyond gold?", "Growth guidance for the near and medium term, and credit cost outlook.", "Why raise so much capital when Tier 1 is already high, and how will it affect returns?"], "why": "Profitability was excellent but the quarter had the first GNPA uptick, an extra provision and a large raise. Reaction was \u22124.3 points vs Nifty.", "view": "A high bar: ROE of ~20% on 5x leverage leaves less room for error, and the raise lowers leverage, so growth has to rise to hold ROE. The gold-loan Stage 2/3 jump looks transient per management but is the data point to watch. I would stay neutral until two clean quarters on asset quality.", "change": "More positive if Stage 2/3 adjusted for gold keeps improving and ROE holds ~20% after the raise. More negative if GNPA keeps rising.", "valuation": "5.6x book on a 20.6% ROE (about 27x implied earnings): the highest multiple and the highest ROE of the six. The premium needs ~25% growth and a stable ROE after the raise. With margin leaking 81 bps and the credit-cost and opex levers largely pulled, there is little cushion."}, "SHRIRAMFIN": {"read": "Negative", "stance": "Neutral (cheapest; moved up from Cautious)", "line": "Great margins, but credit cost is going the wrong way and ROE has reset lower.", "expected": "Given NIM expansion for four quarters and falling Stage 3, I expect the market wanted credit cost to stay near 2% and growth to accelerate as the commercial-vehicle cycle improved.", "delivered": "NIM 9.52% (highest in the window), ROA 3.95%, disbursements +25.7% YoY, AUM +17%. But credit cost rose to about 2.3% (management: 2% long-term plus ~30 bps temporary), Stage 2 is 7.0% and Stage 3 4.65%, and ROE was 13.2% after net worth nearly doubled. Growth guided at only 15\u201317%, described as cautious.", "asked": ["Is credit cost guidance 230 bps this year, coming down after a couple of quarters?", "Is the 15\u201317% growth guide conservative, and when does the book restart growing?", "What share of disbursement is new vehicles, and how much of MSME is unsecured?"], "why": "The credit-cost step-up and a cautious growth guide offset strong margins. Reaction was \u22128.7 points vs Nifty, the weakest of the six.", "view": "On delivery the quarter was negative: credit cost rose, the growth guide is cautious and the margin gain came from funding cost, which cannot fall further and is the lever most at risk if rates rise. I was cautious before adding valuation and the lever analysis. At 2.05x book, with credit-cost normalisation (about +25 bps of RoA) and growth on a capital-rich base still open, I now rate it neutral. I would not go further while funding cost is reversing.", "change": "More positive if credit cost falls back toward 2% and growth beats 17%. More negative if Stage 2 keeps climbing.", "valuation": "2.05x book on a 13.2% ROE that new capital reset from 15\u201316%: the lowest multiple of the six (about 16x implied earnings) and the cheapest per point of ROE. That offsets part of the weak credit-cost trend."}, "CHOLAFIN": {"read": "Positive", "stance": "Neutral to constructive", "line": "Strong growth and returns, with an equity raise and rising Stage 3 to watch.", "expected": "After AUM growth slowed from 30% to a low of 17% and Stage 3 drifted up, I expect the market wanted growth to re-accelerate while Stage 3 stabilised.", "delivered": "Disbursements +47% to \u20b935,872 cr, AUM +25%, PBT +40%, ROE 19.4% (20.3% for H1), NIM 7.9%. Stage 3 3.25% (down from 3.35% a year ago), GNPA 4.44%, capital adequacy 20.6%. Shareholders gave an enabling resolution for a capital raise, with timing left open. Growth guidance referenced at 20\u201323%.", "asked": ["Will future raises happen at lower leverage, and what is the hit to ROA and ROE?", "How did new businesses ramp up so fast, and what is the branch plan?", "Can the full-year guide go higher, and what levers protect FY28 returns?"], "why": "Growth surprised upward while asset quality improved year on year. Reaction was +8.4 points vs Nifty, the strongest of the six.", "view": "Execution is the most consistent of the group, but credit cost is still elevated, Stage 3 is above last year\u2019s low and the reaction already priced a good quarter. I would lean constructive and watch how the raise is sized and what it does to ROE.", "change": "More positive if growth holds above 20% with Stage 3 under 3%. More negative if the raise is large and ROE slips well below 19%.", "valuation": "5.2x book on a 19.4% ROE (about 27x implied earnings): priced like Bajaj, with no clearly open RoA lever. The earnings engine is 25% growth at ~2.5% RoA, so the multiple depends on growth holding and the raise not diluting ROE."}, "LTF": {"read": "Mixed", "stance": "Neutral to constructive", "line": "A steady improver, but still short of its own targets.", "expected": "Given eight quarters of rising ROE and accelerating growth, I expect the market wanted the stock\u2019s improvement to continue and the gap to its stated targets to narrow.", "delivered": "Loan book +28.7%, retail disbursements +27% to \u20b924,027 cr, RoA 2.60% (from 2.48%), ROE 13.6%, NIM 8.88% (+34 bps QoQ), Stage 3 2.43%. Credit cost 2.46%. The deck\u2019s own targets are RoA 3\u20133.2%, ROE 16\u201318% and credit cost under 2%, so it is still short on all three. Gold-loan build-out under way.", "asked": ["What is the steady-state AUM per branch and how much growth comes from it?", "What is the disbursement run rate in October and for the rest of the year?", "Are you seeing more Stage 2 formation in gold loans, and will cost of funds be flat or lower for the year?"], "why": "Trend is right but absolute levels lag targets, and analysts focused on run rate and gold stress. Reaction was \u22124.2 points vs Nifty.", "view": "The direction is the best case for a re-rating story: ROE up about 3.4 points in eight quarters. But credit cost has not moved, so the path to the targets depends on opex leverage and mix. I would stay neutral to constructive while credit cost stays near 2.5%.", "change": "More positive if credit cost drops below 2.2%. More negative if gold-loan Stage 2 formation builds.", "valuation": "2.4x book on a 13.6% ROE (about 17.5x implied earnings): the second cheapest per point of ROE, with the largest open lever (credit cost, about +34 bps of RoA to the under-2% target) and an ROE trend that has risen for eight quarters. The offset is the funding-cost lever, which looks pulled."}, "POONAWALLA": {"read": "Positive", "stance": "Neutral to constructive, higher risk", "line": "A turnaround with the fastest growth, on a thin and unseasoned base.", "expected": "With ROE only recently recovered and a 35\u201340% growth target, I expect the market wanted proof that profit growth could outrun a fast-rising book and that credit cost was easing.", "delivered": "PAT \u20b9375 cr (+22% QoQ), RoA 2.18%, GNPA 1.20% (\u221217 bps QoQ), credit cost 2.19% (\u221225 bps), portfolio yield +45 bps QoQ and disbursement yield +20 bps, NIM plus fees 9.26%. QIP lifted capital; leverage 4.3x. Targets 35\u201340% AUM CAGR; gold-loan branches at 550.", "asked": ["How will new products (18% of disbursements) pan out over the next quarters?", "What is the floating versus fixed funding mix and the sensitivity to the rate hike?", "What ROA is sustainable, and how to trade off growth and profitability?"], "why": "Every metric moved the right way and yields rose. Reaction was +2.0 points vs Nifty, modest for the size of the improvement.", "view": "The recovery is real (ROE from about 1% to 11%) and the open levers are yield-led margin and growth (management guides opex to AUM 15\u201325 bps higher). But earlier I read the modest share-price gain as scepticism; at 3.1x book it is not. The stock is no longer cheap against current returns, credit-cost normalisation is mostly done, loans are unseasoned and funding cost is rising. Neutral to constructive, with higher risk than the others.", "change": "More positive if credit cost falls below 2% while growth holds. More negative if GNPA turns up or funding cost rises faster than yield.", "valuation": "3.1x book on an 11.2% ROE (about 28x implied earnings): priced per point of ROE like Bajaj and Chola. The market is already paying for ROE to reach the high teens, which would need RoA near 3% at 4\u20135x leverage."}}, "val_note": "Price to book against ROE: the market pays about 0.27 turns of book per point of ROE for Bajaj, Chola and Poonawalla, about 0.22 for Aditya Birla Capital, 0.18 for L&T Finance and 0.16 for Shriram. Poonawalla is priced like the 20%-ROE names while earning 11%, so it already assumes the recovery continues. L&T Finance and Shriram are the cheapest per point of ROE."}, "sum": {"ABCAPITAL": {"headline": "A RoA-expansion story built on credit-cost relief; growth re-accelerated and margin stayed flat.", "drove": ["ABFL RoA rose from 2.10% to 2.45% (+35 bps). Pre-tax, lower credit cost (1.36% to 0.92%) gave +44 bps, opex to AUM +6 bps, NIM 0.", "AUM growth held at 20\u201328% YoY, with disbursements recovering from \u22128% YoY (Q3 FY25) to +12% to +41%. Stage 2+3 fell from 4.25% to 2.31%.", "Housing arm RoA went from 1.42% to 2.12% on AUM up about 50%."], "paid": ["The biggest re-ratings (+55 pts vs Nifty over two quarters after Q1 and Q2 FY26) came when disbursement growth turned positive and Stage 3 fell 59 bps. NIM fell 10 bps in Q1 FY26 and the stock still rose 11.8 pts on results.", "The one clear punishment was Q3 FY25: NIM \u221228 bps and disbursements \u22128% led to \u22126.3 pts on results and \u221216 pts over the quarter.", "Read: growth and credit quality are paid for; margin was a one-sided trigger (it hurt when it fell). Caveat: this is a conglomerate, so asset management and insurance also move the stock."], "watch": ["Credit cost is already below the 1.2\u20131.3% guide, so the next RoA leg needs NIM or volume.", "NIM after the October repo move (benchmark rate +25 bps on ~70% variable book).", "Return on the new \u20b94,000 cr equity and \u20b92,750 cr into the housing arm (ROE dilution).", "Q2 FY27 disbursements +12% YoY with corporate flat; branch plan of 1,000+ and gold loans.", "NIM is the metric analysts keep asking about: with credit cost near its floor, margin has to carry the next RoA leg."]}, "BAJFINANCE": {"headline": "Returns held flat because credit-cost and opex gains were offset almost one-for-one by a falling margin.", "drove": ["AUM +22\u201328% YoY; ROA 4.5% to 4.6% and ROE 19.1% to 20.6%.", "Pre-tax RoA bridge: credit cost +60 bps (2.16% to 1.56%) and opex ratio +27 bps, offset by margin incl. fees \u221281 bps (12.1% to 11.3% of average AUM). Residual +7 bps.", "Cost of funds fell 65 bps (7.96% to 7.31%) yet margin still fell, so more than all the funding relief went back through yield, fees and mix. Stage 3 ~1.1%; GNPA 1.06% after +10 bps in Q2 FY27."], "paid": ["Best result window was Q1 FY27 (+7.7 pts vs Nifty) with credit cost \u221221 bps and ROE +0.4. Weakest were asset-quality or news blips: Q2 FY26 \u22126.6 pts (Stage 3 +21 bps) and Q2 FY27 \u22124.3 pts (GNPA +10 bps and a \u20b911,700 cr raise).", "Credit-cost direction (correlation about \u22120.7) and ROE direction (about +0.8) lined up best with results-day moves. Seven or eight data points, so directional only."], "watch": ["Gold-loan Stage 2/3 (\u20b91,047 cr rise in Q2 FY27) and whether stress spreads.", "ROE after the \u20b911,700 cr QIP and promoter warrants (leverage 5.1x falls).", "Credit cost excluding the \u20b9337 cr prudent provision (1.32%) and the 60\u201362 MM new-loan guide.", "Margin incl. fees has fallen 81 bps; it needs to stop falling for the stable 4.6% RoA to hold once credit-cost gains fade."]}, "SHRIRAMFIN": {"headline": "Margin-led RoA surge from falling funding cost, with credit cost rising.", "drove": ["RoA rose from 2.88% to 3.95% (+107 bps; about +143 pre-tax): margin incl. fees +142 bps (9.5% to 10.9% of AUM), opex +26, credit cost \u221221, residual \u22124. Margin did all of it.", "Yield was flat (~17%) while interest cost per AUM fell from 7.7% to 6.2%; part of that is new equity replacing debt (net worth +66% in Q1 FY27). Credit cost rose from about 1.9% to 2.3%.", "AUM growth 15\u201317%, disbursements +10% to +26%. Stage 3 improved from 5.4% to 4.65%; Stage 2 is 7.0%. ROE fell from 15.4% to 13.2% on the larger equity base."], "paid": ["NIM expansion was rewarded over two quarters (+62 pts vs Nifty after Q3 FY26, when NIM rose 39 bps).", "Credit-cost increases were punished immediately: \u221211.1 pts in Q4 FY25 (+29 bps) and \u22128.7 pts in Q2 FY27 (+44 bps). Correlation of results-day move with credit-cost change was about \u22120.6."], "watch": ["Credit cost returning to the 2% long-term guide (this year 2% plus ~30 bps temporary).", "Whether NIM holds when interest rates rise, since falling funding cost drove the gain.", "ROE after the capital infusion, growth guide of 15\u201317%, and Stage 2 at 7%."]}, "CHOLAFIN": {"headline": "Margin-led but small: RoA up 10 bps with opex and credit cost flat.", "drove": ["AUM +25% YoY (low of 17% in Q2 FY26), disbursements +47% in Q2 FY27. RoA 2.4% to 2.5% (reported); ROE 18\u201323% (Q4 is seasonally high).", "Pre-tax RoA bridge: margin +20 bps (7.7% to 7.9%), opex ratio flat at 3.1%, loan losses flat at 1.4%, residual \u22127.", "Asset quality is the soft spot: Stage 3 rose from 2.9% to 3.25% and Stage 2 sits near 2.7%."], "paid": ["The reaction was muted for six quarters (about \u22122 pts each), then +5.8 pts in Q4 FY26 (ROE +3.9, NIM +40 bps) and +8.4 pts in Q2 FY27, when disbursements jumped 47% despite NIM \u221230 bps.", "Read: the stock paid for growth acceleration and falling credit cost, not for margin."], "watch": ["Size and timing of the capital raise (enabling resolution passed) and its effect on ROE.", "Stage 3 versus last year\u2019s low, and credit cost trend.", "Whether the 20\u201323% growth guide is raised, and levers for FY28 returns."]}, "LTF": {"headline": "Steady improver: operating leverage and faster growth lifted ROE, but targets are still ahead.", "drove": ["RoA rose from about 2.3% to 2.6% (+33 bps; about +44 pre-tax). Opex ratio +33 bps (4.41% to 4.08%), margin incl. fees +15 bps, credit cost +3 bps, residual \u22127. Operating leverage did most of the work; credit cost stayed near 2.5%.", "Loan-book growth accelerated from about 18% to 29%; disbursements grew +27% to +49% in recent quarters. ROE went from 10.2% to 13.6%; Stage 3 from 2.85% to 2.43%. NIM (excluding fees) +38 bps, mostly lower funding cost."], "paid": ["Two-quarter windows rewarded the growth step-up (+52 and +43 pts vs Nifty after Q2 and Q3 FY26 as disbursement growth went from 25% to 49%).", "One-day moves were noisy and sometimes negative on good news: Q2 FY27 had NIM +34 bps yet \u22124.2 pts (\u221213 pts over the quarter), which suggests the improvement was priced and attention moved to run-rate and gold stress."], "watch": ["Credit cost near 2.5% versus the deck\u2019s under-2% target; RoA 2.6% versus 3\u20133.2% and ROE 13.6% versus 16\u201318%.", "Gold-loan Stage 2 formation and the disbursement run rate.", "Cost of funds under rising rates."]}, "POONAWALLA": {"headline": "A recovery that is almost entirely credit-cost normalisation, on the fastest-growing book.", "drove": ["RoA rose from 0.3% to 2.3% (computed on average on-book loans, +197 bps; about +263 pre-tax). Credit cost fell from 5.1% to 2.25% of loans (+280 bps) as legacy losses rolled off; opex +8 bps; margin incl. fees \u221223 bps; residual \u22122.", "Margin incl. fees fell to 8.5% in Q1 FY26 and has recovered to 9.5%. Quarterly profit went from \u20b919 cr to \u20b9375 cr; ROE from about 1% to 11%.", "On-book loans grew 40\u201379% YoY. GNPA fell from 1.85% to 1.20%."], "paid": ["Large one-quarter gains while growth ramped (+20 and +24 pts vs Nifty after Q4 FY25 and Q2 FY26 as AUM growth went 45% to 72%), then small reactions as profit turned (+2.5 in Q4 FY26, +2.0 in Q2 FY27).", "The stock is up only ~15% since July 2024, the lowest of the six, while ROE rose ~10 points: the market has not yet paid fully for the recovery."], "watch": ["Credit cost below 2% while loans season (fast growth, new products 18% of disbursements).", "Funding-cost sensitivity to the rate hike and a sustainable RoA near 2.2%.", "Leverage 4.3x after the \u20b92,500 cr QIP and the growth versus profitability trade-off.", "Credit cost normalisation is largely done, so the next RoA step must come from margin and operating leverage."]}}, "nim": {"ABCAPITAL": {"verdict": "Flat. Funding relief was fully passed on, so catch-up depends on mix.", "what": ["NIM held at 5.97\u20136.12% for eight quarters. Yield fell about 35 bps (12.90% to 12.55%) and cost of funds fell about 36 bps (6.91% to 6.55%): every bit of funding relief went to borrowers.", "So the margin cannot catch up from cheaper funding; it has to come from mix or pricing."], "levers": ["Unsecured and personal-loan mix: management said lifting both segments by ~200 bps would add 25\u201330 bps of NIM.", "Benchmark lending rate +25 bps from 26 October on the ~70% variable book, to keep pace with higher funding cost."], "risk": ["A second rate hike, or competitors not following the rate rise, would leave NIM below 6%.", "The credit-cost tailwind that carried RoA is used up, so margin now has to carry the next leg."], "analysts": "Asked when margins start expanding, whether competitors will also raise rates, whether disbursement yields now beat book yields, and what happens if another hike follows."}, "BAJFINANCE": {"verdict": "Falling quietly, masked by credit-cost and opex gains.", "what": ["NII to average AUM fell from 9.72% to 9.43% (\u221229 bps), and net total income (NII plus fees) to average AUM fell from 12.1% to 11.3% (\u221281 bps).", "This happened while cost of funds fell 65 bps (7.96% to 7.31%): funding relief was more than given back through yield, fees and mix. Yield is not disclosed on a comparable basis."], "levers": ["Further cost-of-funds decline (\u22129 bps in Q2 FY27) and deposits (14% of borrowings).", "Mix back toward higher-yield consumer and SME lending; gold and MFI are being scaled."], "risk": ["Gold-loan growth adds lower-yield assets and the first Stage 2/3 uptick.", "The \u20b911,700 cr equity raise lowers leverage and so ROE, unless margin stops slipping."], "analysts": "Asked whether Q2 had any effect on margins, about credit cost, growth guidance and the size of the capital raise."}, "SHRIRAMFIN": {"verdict": "Already caught up and the most exposed to reversal.", "what": ["Reported NIM rose from 8.48% to 9.52%. Yield was flat (~17.0%) while interest cost per AUM fell from 7.69% to 6.23% (\u2212146 bps). The whole gain is funding cost.", "Part of the fall is new equity replacing debt: net worth rose about 66% in Q1 FY27, not repricing alone."], "levers": ["Little left from funding cost; further gains would need pricing or mix.", "Disbursement growth +25.7% YoY."], "risk": ["Rising rates reverse the funding-cost gain with no yield cushion visible in the data.", "Credit cost is rising (about 2.3%), which would eat into a margin that has stopped expanding."], "analysts": "Asked whether pricing policy can absorb the changes and still deliver the planned NIM, about credit cost guidance and growth."}, "CHOLAFIN": {"verdict": "Range-bound. Limited catch-up.", "what": ["Net income margin moved between 7.7% and 8.4% (Q4 was the high in both years) and was 7.9% in Q2 FY27, down 10 bps QoQ. Over the window yield fell 20 bps (14.8% to 14.6%) and cost of funds fell 30 bps (7.1% to 6.8%), for +20 bps of margin.", "Cost of funds has been flat at ~6.6\u20136.8% for four quarters, so the funding tailwind has ended."], "levers": ["Mix toward higher-yield products (gold, SME, new businesses ramping fast).", "Deposit and funding mix as the capital raise lowers leverage."], "risk": ["Rate rise on a book that mostly reprices with a lag.", "The planned raise lowers leverage and so ROA and ROE, as analysts asked directly."], "analysts": "Margin talk in the calls rose from about 2 to nearly 5 mentions per 1,000 words; analysts asked about levers to protect FY28 returns."}, "LTF": {"verdict": "Catching up, but cost-led and the least durable.", "what": ["NIM rose from 8.50% to 8.88% (+38 bps), with +34 bps in Q2 FY27 alone. Yield fell 28 bps (15.04% to 14.76%) while implied funding cost fell 66 bps (6.54% to 5.88%; yield minus NIM).", "Fees and other income are steady, so margin including fees is 10.5%, up only 15 bps."], "levers": ["Lower funding cost and a higher share of retail lending.", "Operating leverage (opex ratio \u221233 bps) matters more to RoA than NIM does."], "risk": ["The Q2 FY27 jump is cost-led, so a rate rise could undo it.", "Analysts asked whether cost of funds will end the year flat or lower."], "analysts": "Asked about cost of funds for the full year, the disbursement run rate and gold-loan Stage 2 formation."}, "POONAWALLA": {"verdict": "Catching up from a deep trough, yield-led.", "what": ["Computed NIM fell from 8.90% to a low of 7.06% in Q1 FY26 and has since recovered to 8.27% (+121 bps). Yield recovered from 13.08% to 14.47% (+139 bps) while interest cost per loan rose from 5.58% to 6.20%.", "It is the only name where yield, not funding cost, is driving the margin. Management cites portfolio yield +45 bps QoQ and disbursement yield +20 bps in Q2 FY27."], "levers": ["Higher-yield products and new lines (18% of disbursements).", "Secured mix at 52% and gold loans."], "risk": ["Funding cost has risen for six quarters and the rate hike adds to it.", "Margin including fees (9.5%) is still below Q3 FY25 (9.75%)."], "analysts": "Margin talk rose from about 0.6 to 5.4 mentions per 1,000 words; analysts asked about the floating versus fixed funding mix and sensitivity of borrowing cost to the hike."}}, "lev": {"ABCAPITAL": {"verdict": "Credit cost is below its floor, so it can only cost RoA from here. The open levers are mix-led margin and growth.", "next": "Mix-led NIM (management: +25\u201330 bps if unsecured and personal loans rise ~200 bps each, worth about +20 bps of RoA) and 25%+ AUM growth. Credit cost is a reversal risk: back to the 1.2% guide costs about 21 bps of RoA.", "rows": [{"lever": "Credit cost", "start": 1.36, "now": 0.92, "best": 0.92, "ref": 1.2, "ref_label": "bottom of the 1.2\u20131.3% guide", "headroom_pre": -28, "headroom_roa": -21, "status": "Pulled (reversal risk)", "note": "Already below the guided band and the lowest in seven years.", "unit": "%"}, {"lever": "Opex ratio", "start": 1.9, "now": 1.84, "best": 1.74, "ref": 1.74, "ref_label": "window best (Q1 FY26)", "headroom_pre": 10, "headroom_roa": 8, "status": "Pulled", "note": "Management says opex to AUM should stay 1.85\u20131.9% even as gold branches open (Q2 FY27 call).", "unit": "%"}, {"lever": "Margin incl. fees", "start": 6.0, "now": 6.0, "best": 6.12, "ref": 6.12, "ref_label": "window high", "headroom_pre": 12, "headroom_roa": 9, "status": "Open (mix, unproven)", "note": "Flat for eight quarters. Management points to unsecured and personal-loan mix.", "unit": "%"}, {"lever": "Funding cost", "start": 6.91, "now": 6.55, "best": 6.52, "ref": 6.52, "ref_label": "window low", "headroom_pre": null, "headroom_roa": null, "status": "Flat", "note": "Relief was passed to borrowers; benchmark rate raised 25 bps on the ~70% variable book.", "unit": "%", "shock_roa": -19}, {"lever": "AUM growth (YoY)", "start": 21, "now": 26, "best": 28, "ref": null, "ref_label": "", "headroom_pre": null, "headroom_roa": null, "status": "Open", "note": "Equity raised (\u20b94,000 cr). Profit can grow about as fast as AUM even if RoA stops rising.", "unit": "%"}]}, "BAJFINANCE": {"verdict": "Credit cost and opex are largely pulled; margin is leaking. Stable returns depend on stopping that, and growth.", "next": "Arresting the 81 bps margin leak (each 10 bps is about 7.5 bps of RoA) and holding ~25% AUM growth. Credit cost has about 18 bps of RoA left only if the \u20b9337 cr prudent provision is released.", "rows": [{"lever": "Credit cost", "start": 2.16, "now": 1.56, "best": 1.54, "ref": 1.32, "ref_label": "excluding the \u20b9337 cr prudent provision", "headroom_pre": 24, "headroom_roa": 18, "status": "Mostly pulled", "note": "At 1.56% against 1.54% best; headroom exists only if the provision reverses.", "unit": "%"}, {"lever": "Opex ratio", "start": 4.0, "now": 3.73, "best": 3.73, "ref": 3.73, "ref_label": "window best (now)", "headroom_pre": 0, "headroom_roa": 0, "status": "Pulled", "note": "Guided opex to net total income to improve 25\u201340 bps in FY27, worth about 3\u20135 bps of AUM.", "unit": "%"}, {"lever": "Margin incl. fees", "start": 12.1, "now": 11.29, "best": 12.1, "ref": 12.1, "ref_label": "window high", "headroom_pre": 81, "headroom_roa": 61, "status": "Reversing (leaking)", "note": "Fell 81 bps even though cost of funds fell 65 bps: yield, fee and mix dilution.", "unit": "%"}, {"lever": "Funding cost", "start": 7.96, "now": 7.31, "best": 7.31, "ref": 7.31, "ref_label": "window low (now)", "headroom_pre": null, "headroom_roa": null, "status": "Pulled (still easing)", "note": "Down 9 bps in Q2 FY27, but the relief is not reaching margin.", "unit": "%", "shock_roa": -19}, {"lever": "AUM growth (YoY)", "start": 28.0, "now": 26.0, "best": 28.0, "ref": null, "ref_label": "", "headroom_pre": null, "headroom_roa": null, "status": "Open", "note": "Leverage 5.1x against a 5\u20135.5x range; the \u20b911,700 cr raise lowers it, so growth has to carry ROE.", "unit": "%"}]}, "SHRIRAMFIN": {"verdict": "The margin lever is fully pulled and is the one at risk. Credit-cost normalisation and growth on a bigger equity base are the open levers.", "next": "Credit cost back to the 2% long-term guide (about +25 bps of RoA) and growth above the cautious 15\u201317% guide on a capital-rich balance sheet. Funding cost cannot fall further: +25 bps would cost about 19 bps of RoA.", "rows": [{"lever": "Credit cost", "start": 2.13, "now": 2.34, "best": 1.83, "ref": 2.0, "ref_label": "management long-term guide", "headroom_pre": 34, "headroom_roa": 25, "status": "Open (guided temporary)", "note": "2.34% in Q2 FY27 against the 2% guide plus about 30 bps temporary.", "unit": "%"}, {"lever": "Opex ratio", "start": 2.72, "now": 2.46, "best": 2.43, "ref": 2.43, "ref_label": "window best", "headroom_pre": 3, "headroom_roa": 2, "status": "Pulled", "note": "Cost to income fell from about 28% to 22.5%.", "unit": "%"}, {"lever": "Margin i  const opp=c.filter(x=>x[0]!=='other'&&x!==top&&x[1]*top[1]<0&&Math.abs(x[1])>=15),sup=c.filter(x=>x[0]!=='other'&&x!==top&&x[1]*top[1]>0&&Math.abs(x[1])>=15);
 if(Math.abs(tot)<20&&opp.length)return `RoA flat (${fm(tot)} pre-tax): ${c.filter(x=>x[1]>=15).map(x=>x[0]+' '+fm(x[1])).join(' and ')} offset by ${c.filter(x=>x[1]<=-15).map(x=>x[0]+' '+fm(x[1])).join(' and ')}.`;
 const sh=Math.round(top[1]/tot*100),cap=top[0][0].toUpperCase()+top[0].slice(1),lead=sh>100?`${cap} ${fm(top[1])}, more than the whole ${fm(tot)} pre-tax RoA gain`:`${cap} drove it: ${fm(top[1])} of ${fm(tot)} pre-tax RoA gain (${sh}%)`;const ps=[];if(sup.length)ps.push(sup.map(x=>x[0]+' '+fm(x[1])).join(' and ')+' helping');if(opp.length)ps.push(opp.map(x=>x[0]+' '+fm(x[1])).join(' and ')+' against');
 return lead+(ps.length?'; '+ps.join('; '):'')+'.'}

 const M=[['g','<b>RoA rose at all six</b> since Q3 FY25: Poonawalla +197 bps, Shriram +107, Aditya Birla Capital +35, L&T Finance +33, Bajaj +10, Chola +10.'],

  <div class="row5"><div class="pn"><h3>Growth (% YoY)</h3><div class="cvs"><canvas id="g_${s}"></canvas></div></div><div class="pn"><h3>Margin and cost (%)</h3><div class="cvs"><canvas id="m_${s}"></canvas></div></div><div class="pn"><h3>Asset quality (%)</h3><div class="cvs"><canvas id="a_${s}"></canvas></div></div><div class="pn"><h3>ROA and ROE (%)</h3><div class="cvs"><canvas id="r_${s}"></canvas></div></div><div class="pn"><h3>Where the RoA change came from (bps)</h3><div class="cvs"><canvas id="b_${s}"></canvas></div></div></div></div>`}).join('');
 document.getElementById('view').innerHTML=`<div class="top"><div class="card"><h2>What mattered</h2><ul class="mt">${M.map(([t,h])=>`<li class="${t}">${h}</li>`).join('')}</ul></div><div class="card"><h2>What the calls talked about</h2><div class="scroll">${themes}</div></div></div>
 <div class="two"><div class="card"><h2>Where the RoA gain came from</h2><p class="so mut" style="margin:0 0 4px">Pre-tax bps, first to latest quarter. Credit cost led at Aditya Birla Capital and Poonawalla, margin at Shriram and Chola, opex at L&T Finance; Bajaj’s gains were offset.</p><div class="cvs" style="height:190px"><canvas id="rb"></canvas></div></div>

 {const names=SY.map(SH),bs=SY.map(x=>D.std[x].bridge),L=i=>bs.map(b=>b[i][b.q.length-1]),get=(x,l)=>D.lev[x].rows.find(r=>r.lever.startsWith(l));
  mk('rb',{data:{labels:names,datasets:[{type:'bar',label:'Margin incl. fees',data:L('nim'),backgroundColor:'#1f5fbf',stack:'a'},{type:'bar',label:'Opex ratio',data:L('opex'),backgroundColor:'#2e8b6a',stack:'a'},{type:'bar',label:'Credit cost',data:L('cc'),backgroundColor:'#d2691e',stack:'a'},{type:'bar',label:'Residual',data:L('other'),backgroundColor:'#9a998f',stack:'a'},{type:'line',label:'Total',data:L('roa_pre'),showLine:false,borderColor:css('--ink'),backgroundColor:css('--ink'),pointRadius:4}]},options:opt({scales:{x:{stacked:true,ticks:{color:css('--mute'),maxRotation:0},grid:{display:false}},y:{stacked:true,ticks:{color:css('--mute'),maxTicksLimit:6},grid:{color:css('--line')}}}})});
  const hd=l=>SY.map(x=>{const r=get(x,l);return r&&r.headroom_roa>0?r.headroom_roa:0}),neg=SY.map(x=>{const r=get(x,'Credit cost');return r&&r.headroom_roa<0?r.headroom_roa:0}),sh=SY.map(x=>{const r=get(x,'Funding');return r&&r.shock_roa?r.shock_roa:0});
  mk('lv',{type:'bar',data:{labels:names,datasets:[{label:'Credit cost headroom',data:hd('Credit cost'),backgroundColor:'#d2691e',stack:'p'},{label:'Opex headroom',data:hd('Opex'),backgroundColor:'#2e8b6a',stack:'p'},{label:'Margin headroom',data:hd('Margin'),backgroundColor:'#1f5fbf',stack:'p'},{label:'Credit cost below floor',data:neg,backgroundColor:'#9a998f',stack:'n'},{label:'Funding +25 bps',data:sh,backgroundColor:'#c0392b',stack:'n'}]},options:opt({scales:{x:{stacked:true,ticks:{color:css('--mute'),maxRotation:0},grid:{display:false}},y:{stacked:true,ticks:{color:css('--mute'),maxTicksLimit:6},grid:{color:css('--line')}}}})})}
 SY.forEach(s=>{const m=D.mkt[s];
  const mark={id:'mk',afterDatasetsDraw(ch){const {ctx,chartArea:a,scales:{x}}=ch;ctx.save();ctx.setLineDash([2,3]);ctx.strokeStyle=css('--mute');m.events.forEach(e=>{const i=m.dates.indexOf(e.date);if(i<0)return;const p=x.getPixelForValue(i);ctx.beginPath();ctx.moveTo(p,a.top);ctx.lineTo(p,a.bottom);ctx.stroke()});ctx.restore()}};
  mk('px_'+s,{type:'line',data:{labels:m.dates,datasets:[{label:'Stock',data:m.stock,borderColor:COL[s],pointRadius:0,borderWidth:1.5},{label:'Nifty',data:m.nifty,borderColor:css('--mute'),pointRadius:0,borderWidth:1}]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{display:false},y:{display:false}},interaction:{mode:'index',intersect:false}},plugins:[mark]},true);

const DATA_ROWS=[['AUM (₹ cr)','aum',0],['AUM growth YoY (%)','aum_yoy',1],['Disbursement growth YoY (%)','disb_yoy',1],['NIM (%)','nim',2],['Margin incl. fees (%)','margin_fee',2],['Yield (%)','yield_',2],['Funding cost (%)','cof',2],['Opex ratio (%)','opex',2],['Credit cost (%)','credit_cost',2],['Stage 2 (%)','stage2',2],['Stage 3 / GNPA (%)','stage3',2],['Stage 3 PCR (%)','pcr3',1],['ECL Stage 1 (%)','ecl_s1',2],['ECL Stage 2 (%)','ecl_s2',1],['ROA (%)','roa',2],['ROE (%)','roe',1],['Net worth (₹ cr)','networth',0],['PAT (₹ cr)','pat',0],['Leverage (x)','leverage',1]];
let FILT='ALL';
function postOne(s,q,months){const m=D.mkt[s],Ds=m.dates,R=m.events.find(e=>e.q===q).date,end=new Date(new Date(R).getTime()+months*30.4375*864e5).toISOString().slice(0,10);if(end>Ds[Ds.length-1])return null;const ix=d=>{let lo=0,hi=Ds.length-1;while(lo<hi){const k=(lo+hi+1)>>1;if(Ds[k]<=d)lo=k;else hi=k-1}return lo};const a=ix(R),b=ix(end);return((m.stock[b]/m.stock[a]-1)-(m.nifty[b]/m.nifty[a]-1))*100}
function dataRows(){const rows=[];SY.filter(s=>FILT==='ALL'||s===FILT).forEach(s=>{DATA_ROWS.forEach(([l,k,d])=>{const v=ser(s,k);if(v.some(x=>x!=null))rows.push([D.std[s].name,l,...v.map(x=>x==null?null:+(+x).toFixed(d))])});
 rows.push([D.std[s].name,'Results date',...Q8.map(q=>D.mkt[s].events.find(e=>e.q===q).date)]);
 const v=D.val[s];rows.push([D.std[s].name,'Valuation (13 Nov 2026): price / BVPS / P/B / implied P/E',`${v.price} / ${v.bvps} / ${v.pb}x${v.est?'*':''} / ${v.pe}x`,...Array(7).fill(null)])});return rows}
