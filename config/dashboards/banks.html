nd Federal (guided +5\u20136 bps a quarter, flat in Q2) point up."], ["r", "<b>The rate cycle has turned:</b> repo +25 bps on 7 Oct, IDFC First assumes 25 bps more, City Union expects deposit rates to rise. Funding relief is largely done at Federal and CUB; still open at Bandhan (term deposits repricing) and AU (CASA)."], ["g", "<b>Credit cost fell at Federal (50 to 31 bps), AU (1.2% to 0.8%), Bandhan (3.4% to 1.8%) and IDFC First (1.58% to 1.01%),</b> and GNPA improved at all six."], ["g", "<b>Growth can hold at five of six</b> (Federal, IDFC First, AU, RBL, City Union). Bandhan is partial: loans +14.9% against deposits +9.2%."], ["r", "<b>Targets moved at Bandhan</b> (NIM 7\u20137.5% to 6.1\u20136.2%, growth 15\u201317% to ~14%, ROA exit target now 'more challenging'). Federal raised its credit-cost guide once; IDFC First's opex ran above guide. AU, City Union and RBL met or beat theirs."]], "keys": ["loan_g_yoy", "dep_g_yoy", "casa_ratio", "nim", "cost_of_deposits", "yield_advances", "credit_cost", "gnpa", "nnpa", "pcr", "slippage_ratio", "cost_to_income", "roa", "roe", "bvps", "crar", "cet1", "nii", "other_income", "opex", "ppop", "provisions", "pat", "total_assets", "advances", "deposits"]};Chart.defaults.font.size=10;

const tabs=document.getElementById('tabs');[['Sector','Sector view'],['Data','Data'],['Views','Views']].forEach(([t,l])=>{const b=document.createElement('button');b.className='tab';b.textContent=l;b.dataset.t=t;b.onclick=()=>show(t);tabs.appendChild(b)});
function show(t){CUR=t;charts.forEach(c=>c.destroy());charts=[];document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));location.hash=t;({Sector:sector,Data:dataTab,Views:views})[t]()}

const stCls=t=>/^(Open|Partly|Stable|Mixed)/.test(t)&&!/risk/i.test(t)?'pos':/(risk|Headwind|Pulled \(reversal|Reversing|Unclear)/i.test(t)?'neg':'';
const gTone=t=>/^(Behind|Above guide|At risk|Re-based|Lowered)/.test(t)?'neg':/,|then|after|softer|Stepping|Loosened/.test(t)?'mid':'pos';
const evList=a=>`<ul class="ev">${a.map(e=>`<li><span class="src">${e.s}</span>${e.t}</li>`).join('')}</ul>`;
const guideTbl=g=>`<table class="gt"><tr><th>Metric</th><th>What they said</th><th>What happened</th><th></th></tr>${g.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td class="${gTone(r[3])}"><b>${r[3]}</b></td></tr>`).join('')}</table>`;
function bridgeSentence(s){const br=B[s].bridge,i=br.q.length-1,c=[['net interest income',br.nim[i]],['fees and other income',br.oth[i]],['opex',br.opex[i]],['provisions and tax',br.pt[i]]],fm=v=>(v>=0?'+':'')+v+' bps',tot=br.roa[i];const big=[...c].sort((x,y)=>Math.abs(y[1])-Math.abs(x[1]));const pos=c.filter(x=>x[1]>=15).map(x=>x[0]+' '+fm(x[1])),neg=c.filter(x=>x[1]<=-15).map(x=>x[0]+' '+fm(x[1]));
 return `RoA ${fm(tot)} since Q3 FY25 (${br.q[i]}): ${pos.length?pos.join(', ')+' helped':'no driver above 15 bps helped'}${neg.length?'; '+neg.join(', ')+' worked against it':''}. Biggest: ${big[0][0]} (${fm(big[0][1])}).`}
const levChips=s=>B[s].lev.rows.map(r=>`<span class="${stCls(r.status)}" title="${r.note}"><b>${r.lever}</b> ${r.status}</span>`).join('');
const last=(s,k)=>{const a=B[s].s[k].filter(v=>v!=null);return a.length?a[a.length-1]:null};
function sector(){
 const T=Object.keys(D.mkt[SY[0]].topics.Q2FY27),hv=SY.map(s=>D.mkt[s].topics.Q2FY27);
 const themes=`<table class="tt"><tr><th>Per 1,000 words, Q2 FY27 call</th>${SY.map(s=>`<th>${SH(s).split(' ')[0]}</th>`).join('')}</tr>${T.map(t=>{const v=hv.map(x=>x?x[t]:null),mx=Math.max(...v.filter(x=>x!=null));return `<tr><td>${t}</td>${v.map(x=>`<td style="background:rgba(31,95,191,${x==null?0:(x/mx*.5).toFixed(2)})">${f1(x)}</td>`).join('')}</tr>`}).join('')}</table>`;
 const blocks=SY.map(s=>{const c=B[s],v=c.val,A=c.ans;
  return `<div class="card"><div class="hd"><div class="l"><span class="nm"><span class="dot" style="background:${COL[s]}"></span>${c.name}</span> <span class="pill"><b>${c.views.stance}</b></span> <span class="mut" style="font-size:12px">${c.model}</span>
  <div class="k"><span>ROE <b>${f1(last(s,'roe'))}%</b></span><span>RoA <b>${f1(last(s,'roa'),2)}%</b></span><span>NIM <b>${f1(last(s,'nim'),2)}%</b></span><span>Loans <b>${f1(last(s,'loan_g_yoy'),0)}%</b></span><span>Deposits <b>${f1(last(s,'dep_g_yoy'),0)}%</b></span><span>GNPA <b>${f1(last(s,'gnpa'),2)}%</b></span><span>Credit cost <b>${f1(last(s,'credit_cost'),2)}%</b></span><span>P/B <b>${f1(v.pb,1)}x</b></span></div></div><div class="r"><canvas id="px_${s}"></canvas></div></div>
  <div class="trio"><div class="qb"><div class="qh">Can NIM improve from here? <span class="ans ${A.nim.tone}">${A.nim.a}</span></div>${evList(A.nim.ev)}</div>
  <div class="qb"><div class="qh">Can growth hold up? <span class="ans ${A.growth.tone}">${A.growth.a}</span></div>${evList(A.growth.ev)}</div>
  <div class="qb"><div class="qh">Guidance versus delivery <span class="mut" style="font-weight:400;font-size:12px">(all eight calls)</span></div>${guideTbl(A.guide)}<div class="ln" style="font-size:12.5px"><b>${A.gverdict}</b></div></div></div>
  <div class="ln"><i>RoA driver</i>${bridgeSentence(s)}</div><div class="ln"><i>Levers left</i><span class="lv">${levChips(s)}</span></div><div class="ln"><i>Next lever</i>${c.lev.verdict}</div>
  <div class="row5"><div class="pn"><h3>Growth (% YoY)</h3><div class="cvs"><canvas id="g_${s}"></canvas></div></div><div class="pn"><h3>Margin and cost (%)</h3><div class="cvs"><canvas id="m_${s}"></canvas></div></div><div class="pn"><h3>Asset quality (%)</h3><div class="cvs"><canvas id="a_${s}"></canvas></div></div><div class="pn"><h3>ROA and ROE (%)</h3><div class="cvs"><canvas id="r_${s}"></canvas></div></div><div class="pn"><h3>Where the RoA change came from (bps)</h3><div class="cvs"><canvas id="b_${s}"></canvas></div></div></div></div>`}).join('');
 document.getElementById('view').innerHTML=`<div class="top"><div class="card"><h2>What mattered</h2><ul class="mt">${D.mattered.map(([t,h])=>`<li class="${t}">${h}</li>`).join('')}</ul></div><div class="card"><h2>What the calls talked about</h2><div class="scroll">${themes}</div></div></div>
 <div class="two"><div class="card"><h2>Where the RoA change came from</h2><p class="so mut" style="margin:0 0 4px">Bps, Q2 FY27 versus Q3 FY25, on average total assets. Provisions and tax is what is left of operating profit after PAT.</p><div class="cvs" style="height:200px"><canvas id="rb"></canvas></div></div>
 <div class="card"><h2>Next lever by bank</h2><div class="scroll"><table class="gt">${SY.map(s=>`<tr><td><span class="dot" style="background:${COL[s]}"></span><b>${SH(s)}</b></td><td>${B[s].lev.verdict}</td></tr>`).join('')}</table></div></div></div>${blocks}`;
 {const names=SY.map(SH),g=k=>SY.map(x=>{const a=B[x].bridge[k];return a[a.length-1]});
  mk('rb',{data:{labels:names,datasets:[{type:'bar',label:'Net interest income',data:g('nim'),backgroundColor:'#1f5fbf',stack:'a'},{type:'bar',label:'Fees and other income',data:g('oth'),backgroundColor:'#8a4fb0',stack:'a'},{type:'bar',label:'Opex',data:g('opex'),backgroundColor:'#2e8b6a',stack:'a'},{type:'bar',label:'Provisions and tax',data:g('pt'),backgroundColor:'#d2691e',stack:'a'},{type:'line',label:'Total RoA change',data:g('roa'),showLine:false,borderColor:css('--ink'),backgroundColor:css('--ink'),pointRadius:4}]},options:opt({scales:{x:{stacked:true,ticks:{color:css('--mute'),maxRotation:0},grid:{display:false}},y:{stacked:true,ticks:{color:css('--mute'),maxTicksLimit:6},grid:{color:css('--line')}}}})})}
 SY.forEach(s=>{const m=D.mkt[s],c=B[s],S=c.s;
  const mark={id:'mk',afterDatasetsDraw(ch){const {ctx,chartArea:a,scales:{x}}=ch;ctx.save();ctx.setLineDash([2,3]);ctx.strokeStyle=css('--mute');m.events.forEach(e=>{const i=m.dates.indexOf(e.date);if(i<0)return;const p=x.getPixelForValue(i);ctx.beginPath();ctx.moveTo(p,a.top);ctx.lineTo(p,a.bottom);ctx.stroke()});ctx.restore()}};
  mk('px_'+s,{type:'line',data:{labels:m.dates,datasets:[{label:'Stock',data:m.stock,borderColor:COL[s],pointRadius:0,borderWidth:1.5},{label:'Nifty',data:m.nifty,borderColor:css('--mute'),pointRadius:0,borderWidth:1}]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{display:false},y:{display:false}},interaction:{mode:'index',intersect:false}},plugins:[mark]},true);
  const ds=(l,k,col,w=1.8,x={})=>({label:l,data:S[k],borderColor:col,backgroundColor:col,pointRadius:2,borderWidth:w,tension:.15,...x}),line=sets=>({type:'line',data:{labels:Q8,datasets:sets.filter(d=>d.data.some(v=>v!=null))},options:opt()});
  mk('g_'+s,line([ds('Loans','loan_g_yoy',COL[s]),ds('Deposits','dep_g_yoy','#d2691e')]));
  mk('m_'+s,line([ds('NIM','nim',COL[s],2.4),ds('Cost of deposits','cost_of_deposits','#d2691e'),ds('Yield on advances','yield_advances','#1f5fbf')]));
  mk('a_'+s,line([ds('GNPA','gnpa','#c0392b'),ds('NNPA','nnpa','#d2691e'),ds('Credit cost','credit_cost','#6b6a63',1.8,{borderDash:[4,3]})]));
  mk('r_'+s,{type:'line',data:{labels:Q8,datasets:[ds('ROA','roa','#2e8b6a'),ds('ROE','roe',COL[s],2.4,{yAxisID:'y1'})]},options:opt({scales:{x:{ticks:{color:css('--mute'),maxTicksLimit:4,maxRotation:0},grid:{display:false}},y:{ticks:{color:css('--mute'),maxTicksLimit:5},grid:{color:css('--line')}},y1:{position:'right',ticks:{color:css('--mute'),maxTicksLimit:5},grid:{display:false}}}})});
  const b=c.bridge;mk('b_'+s,{data:{labels:b.q,datasets:[{type:'bar',label:'NII',data:b.nim,backgroundColor:'#1f5fbf',stack:'a'},{type:'bar',label:'Fees',data:b.oth,backgroundColor:'#8a4fb0',stack:'a'},{type:'bar',label:'Opex',data:b.opex,backgroundColor:'#2e8b6a',stack:'a'},{type:'bar',label:'Prov+tax',data:b.pt,backgroundColor:'#d2691e',stack:'a'},{type:'line',label:'Total',data:b.roa,borderColor:css('--ink'),backgroundColor:css('--ink'),pointRadius:2,borderWidth:1.5}]},options:opt({scales:{x:{stacked:true,ticks:{color:css('--mute'),maxTicksLimit:4,maxRotation:0},grid:{display:false}},y:{stacked:true,ticks:{color:css('--mute'),maxTicksLimit:5},grid:{color:css('--line')}}}})});
 })}

/* ---------- Data tab ---------- */
const ROWS=[['Loan growth YoY (%)','loan_g_yoy',1],['Deposit growth YoY (%)','dep_g_yoy',1],['CASA ratio (%)','casa_ratio',1],['NIM (%)','nim',2],['Cost of deposits (%)','cost_of_deposits',2],['Yield on advances (%)','yield_advances',2],['Credit cost (%)','credit_cost',2],['GNPA (%)','gnpa',2],['NNPA (%)','nnpa',2],['PCR (%)','pcr',1],['Slippage ratio (%)','slippage_ratio',2],['Cost to income (%)','cost_to_income',1],['ROA (%)','roa',2],['ROE (%)','roe',1],['Book value per share (₹)','bvps',1],['CRAR (%)','crar',1],['CET1 (%)','cet1',1],['Net interest income (₹ cr)','nii',0],['Other income (₹ cr)','other_income',0],['Operating expenses (₹ cr)','opex',0],['Operating profit (₹ cr)','ppop',0],['Provisions (₹ cr)','provisions',0],['PAT (₹ cr)','pat',0],['Total assets (₹ cr)','total_assets',0],['Advances (₹ cr)','advances',0],['Deposits (₹ cr)','deposits',0]];
let FILT='ALL';
function dataRows(){const r=[];SY.filter(s=>FILT==='ALL'||s===FILT).forEach(s=>{const c=B[s];ROWS.forEach(([l,k,d])=>{const v=c.s[k];if(v.some(x=>x!=null))r.push([c.name,l,...v.map(x=>x==null?null:+(+x).toFixed(d))])});r.push([c.name,'Results date',...Q8.map(q=>D.mkt[s].events.find(e=>e.q===q).date)]);r.push([c.name,'Valuation (13 Nov 2026): price / BVPS / P/B / implied P/E',`${c.val.price} / ${c.val.bvps} / ${c.val.pb}x / ${c.val.pe}x`,...Array(7).fill(null)])});return r}
function dataTab(){const rows=dataRows();
 document.getElementById('view').innerHTML=`<div class="card"><div class="ctl"><label>Show <select onchange="FILT=this.value;show('Data')"><option value="ALL">All banks</option>${SY.map(s=>`<option value="${s}" ${s===FILT?'selected':''}>${B[s].name}</option>`).join('')}</select></label><button class="b" onclick="dl()">Download CSV</button></div>
 <div class="scroll" style="max-height:74vh"><table><tr><th>Bank</th><th>Metric</th>${Q8.map(q=>`<th>${q}</th>`).join('')}</tr>${rows.map((r,i)=>`<tr${i&&r[0]!==rows[i-1][0]?' style="border-top:2px solid var(--ink)"':''}><td>${r[0]}</td><td style="text-align:left">${r[1]}</td>${r.slice(2).map(x=>`<td>${x==null?'–':typeof x==='number'?x.toLocaleString('en-IN',{maximumFractionDigits:2}):x}</td>`).join('')}</tr>`).join('')}</table></div>
 <details open><summary>Definitions and caveats by bank</summary>${SY.filter(s=>FILT==='ALL'||s===FILT).map(s=>`<p class="so"><b>${B[s].name}:</b> ${Object.entries(B[s].defs).map(([k,v])=>`<i>${k}</i>: ${v}`).join(' · ')}<br><span class="mut">${B[s].notes.slice(0,6).join(' ')}</span></p>`).join('')}<p class="so">Each value was read from the bank's decks and calls by an extraction agent that recorded a source for every figure; I cross-checked headline values against the latest-quarter figures. Federal's Q4 FY26 NIM, ROA and credit cost are shown excluding its one-offs (reported: 3.74%, 1.36%, 1.18%). “–” means not disclosed or not found. RoA-change bars use average total assets, estimated for City Union's three quarters without a balance sheet (advances times its median assets-to-advances ratio).</p></details></div>`}
function dl(){const rows=dataRows(),csv=[['Bank','Metric',...Q8],...rows].map(r=>r.map(x=>`"${x==null?'':x}"`).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='banks_data.csv';a.click()}

/* ---------- Views tab ---------- */
function views(){const sc=x=>x.startsWith('Positive')?'pos':x.startsWith('Negative')?'neg':'';
 document.getElementById('view').innerHTML=`<div class="card"><h2>Views</h2><p class="so mut">${D.intro}</p><div class="scroll"><table><tr><th>Bank</th><th>Delivery vs expectations</th><th>P/B</th><th>ROE</th><th>Implied P/E</th><th>P/B per ROE pt</th><th>My stance</th><th style="text-align:left">One line</th></tr>${SY.map(s=>{const v=B[s].val,w=B[s].views;return `<tr><td><span class="dot" style="background:${COL[s]}"></span>${B[s].name}</td><td class="${sc(w.read)}">${w.read}</td><td>${f1(v.pb,2)}</td><td>${f1(v.roe)}%</td><td>${f1(v.pe)}x</td><td>${f1(v.pb/v.roe,2)}</td><td><b>${w.stance}</b></td><td style="text-align:left;white-space:normal">${w.line}</td></tr>`}).join('')}</table></div><p class="so mut">${D.val_note}</p></div>
 <div class="card"><h2>Common threads from the Q2 FY27 calls</h2><ul>${D.themes.map(t=>`<li>${t}</li>`).join('')}</ul></div>
 <div class="grid2">${SY.map(s=>{const c=B[s],w=c.views;return `<div class="card"><div class="nm"><span class="dot" style="background:${COL[s]}"></span>${c.name}</div><span class="pill">${w.read}</span><span class="pill"><b>${w.stance}</b></span>
 <p class="so"><b>What the market wanted:</b> ${w.expected}</p><p class="so"><b>What the Q2 FY27 call delivered:</b> ${w.delivered}</p><p class="so"><b>What analysts asked:</b></p><ul>${w.asked.map(a=>`<li>${a}</li>`).join('')}</ul><p class="so"><b>Positive or negative?</b> ${w.why}</p><p class="so"><b>Valuation:</b> ${w.valuation}</p><p class="so"><b>My view:</b> ${w.view}</p><p class="so"><b>What would change it:</b> ${w.change}</p></div>`}).join('')}</div>`}
document.getElementById('foot').innerHTML='Sources: NSE filings, company investor pages, NSE Bhavcopy and Nifty 50. Eight quarters per bank from the decks and calls, one extraction agent per bank. Not investment advice.';
{const h=location.hash.slice(1);show(['Sector','Data','Views'].includes(h)?h:'Sector')}
</script></body></html>
